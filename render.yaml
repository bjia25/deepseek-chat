# Render Blueprint —— 在 render.com 选择 "New + > Blueprint" 并指向本仓库即可
services:
  - type: web
    name: deepseek-chat
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 部署时在 Render 控制台手动填写真实 Key（不会提交到仓库）
      - key: DEEPSEEK_API_KEY
        sync: false
      # 自动生成一个随机访问密码，部署后可在 Environment 里查看
      - key: ACCESS_PASSWORD
        generateValue: true
